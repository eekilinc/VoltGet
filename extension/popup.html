<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VoltGet Download Manager</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #07090e;
        --panel: #101422;
        --panel-2: #151a2d;
        --panel-3: #0c101c;
        --border: rgba(255, 255, 255, 0.09);
        --border-2: rgba(255, 255, 255, 0.16);
        --text: #f1f5f9;
        --muted: #94a3b8;
        --accent: #2563eb;
        --accent-2: #0ea5e9;
        --ok: #22c55e;
        --warn: #f59e0b;
        --danger: #ef4444;
      }
      body {
        width: 400px;
        min-height: 260px;
        max-height: 580px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      button {
        font: inherit;
        cursor: pointer;
        transition: all 0.14s ease;
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        gap: 8px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        min-width: 0;
      }
      .brand-icon {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.38);
      }
      .brand-title {
        font-weight: 800;
        font-size: 13.5px;
        letter-spacing: -0.02em;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 8px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 700;
        border: 1px solid var(--border);
        background: var(--panel-2);
        color: var(--muted);
      }
      .status-pill.online {
        background: rgba(34, 197, 94, 0.14);
        border-color: rgba(34, 197, 94, 0.35);
        color: #4ade80;
      }
      .status-pill.offline {
        background: rgba(239, 68, 68, 0.14);
        border-color: rgba(239, 68, 68, 0.35);
        color: #fca5a5;
      }
      .dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: currentColor;
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .icon-btn {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--panel-2);
        color: var(--muted);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .icon-btn:hover {
        color: #fff;
        border-color: var(--border-2);
      }
      .icon-btn.active {
        background: rgba(37, 99, 235, 0.2);
        border-color: rgba(37, 99, 235, 0.5);
        color: #60a5fa;
      }
      .site-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 14px;
        background: var(--panel-3);
        border-bottom: 1px solid var(--border);
        gap: 8px;
      }
      .domain-label {
        font-size: 11px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
      }
      .domain-label strong {
        color: var(--text);
      }
      .pill-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 4px 9px;
        border-radius: 7px;
        border: 1px solid var(--border);
        background: var(--panel-2);
        color: var(--text);
        font-size: 10.5px;
        font-weight: 700;
        flex-shrink: 0;
      }
      .pill-btn:hover {
        border-color: var(--border-2);
      }
      .pill-btn.excluded {
        background: rgba(239, 68, 68, 0.14);
        border-color: rgba(239, 68, 68, 0.35);
        color: #fca5a5;
      }
      .pill-btn.paused {
        background: rgba(245, 158, 11, 0.14);
        border-color: rgba(245, 158, 11, 0.35);
        color: #fcd34d;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px 6px;
      }
      .tabs {
        display: flex;
        gap: 3px;
        background: var(--panel-3);
        border: 1px solid var(--border);
        padding: 3px;
        border-radius: 9px;
        flex-shrink: 0;
      }
      .tab {
        padding: 5px 10px;
        border-radius: 6px;
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
      }
      .tab.active {
        background: var(--accent);
        color: #fff;
      }
      .search-input {
        flex: 1;
        min-width: 0;
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--panel-2);
        color: var(--text);
        font-size: 11px;
        outline: none;
      }
      .search-input:focus {
        border-color: var(--accent);
      }
      .pair-banner {
        margin: 8px 14px 0;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgba(245, 158, 11, 0.1);
        border: 1px solid rgba(245, 158, 11, 0.32);
        display: none;
        flex-direction: column;
        gap: 8px;
      }
      .pair-banner.visible {
        display: flex;
      }
      .pair-title {
        font-size: 11.5px;
        font-weight: 800;
        color: #fde047;
      }
      .pair-row {
        display: flex;
        gap: 6px;
      }
      .pair-input {
        flex: 1;
        padding: 6px 8px;
        border-radius: 7px;
        border: 1px solid var(--border-2);
        background: var(--panel-3);
        color: var(--text);
        font-size: 11px;
        font-family: ui-monospace, Consolas, monospace;
        outline: none;
      }
      .pair-status {
        font-size: 10.5px;
        color: var(--muted);
      }
      .list {
        flex: 1;
        overflow-y: auto;
        padding: 8px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 290px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 9px 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .card:hover {
        border-color: var(--border-2);
      }
      .card-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .type-badge {
        font-size: 9.5px;
        font-weight: 800;
        text-transform: uppercase;
        padding: 2px 6px;
        border-radius: 5px;
        background: rgba(37, 99, 235, 0.18);
        color: #60a5fa;
        border: 1px solid rgba(37, 99, 235, 0.35);
      }
      .meta {
        font-size: 10px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .card-title {
        font-size: 11.5px;
        font-weight: 700;
        color: #fff;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .card-url {
        font-size: 10px;
        font-family: ui-monospace, Consolas, monospace;
        color: var(--muted);
        background: var(--panel-3);
        border: 1px solid var(--border);
        padding: 4px 7px;
        border-radius: 6px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .card-actions {
        display: flex;
        gap: 6px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        padding: 6px 10px;
        border-radius: 7px;
        border: 0;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: #fff;
        font-size: 11px;
        font-weight: 700;
      }
      .btn:hover {
        filter: brightness(1.08);
      }
      .btn-secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        padding: 6px 9px;
        border-radius: 7px;
        border: 1px solid var(--border);
        background: var(--panel-2);
        color: var(--text);
        font-size: 11px;
        font-weight: 600;
      }
      .btn-secondary:hover {
        border-color: var(--border-2);
      }
      .btn-danger {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        padding: 6px 9px;
        border-radius: 7px;
        border: 1px solid rgba(239, 68, 68, 0.35);
        background: rgba(239, 68, 68, 0.14);
        color: #fca5a5;
        font-size: 11px;
        font-weight: 700;
      }
      .empty {
        text-align: center;
        padding: 28px 16px;
        color: var(--muted);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .empty strong {
        color: var(--text);
        font-size: 12.5px;
      }
      .settings-drawer {
        display: none;
        padding: 10px 14px;
        background: var(--panel-3);
        border-top: 1px solid var(--border);
        flex-direction: column;
        gap: 8px;
      }
      .settings-drawer.open {
        display: flex;
      }
      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
        color: var(--text);
        cursor: pointer;
      }
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        padding: 10px 14px;
        background: var(--panel);
        border-top: 1px solid var(--border);
      }
      .footer-left {
        display: flex;
        gap: 6px;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
          </svg>
        </div>
        <div>
          <div class="brand-title">
            <span>VoltGet</span>
            <span class="status-pill" id="statusPill">
              <span class="dot"></span>
              <span id="statusText">Kontrol ediliyor</span>
            </span>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button class="pill-btn" id="toggleCapture" title="Yakalamayı aç/kapat">Aktif</button>
        <button class="icon-btn" id="settingsBtn" title="Ayarlar ve Eşleştirme">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"
            />
          </svg>
        </button>
      </div>
    </header>

    <div class="site-bar">
      <div class="domain-label" id="domainLabel">Sayfa: <strong>—</strong></div>
      <button class="pill-btn" id="excludeSiteBtn">Siteyi Hariç Tut</button>
      <button class="btn" id="batchBtn" style="padding: 4px 9px; font-size: 10.5px; display: none">
        Tümünü İndir
      </button>
    </div>

    <div class="pair-banner" id="pairBanner">
      <div class="pair-title">VoltGet Masaüstü Eşleştirmesi Gerekli</div>
      <div class="pair-row">
        <button class="btn" id="autoPairBtn" style="flex: 1">Otomatik Eşleştir</button>
      </div>
      <div class="pair-row">
        <input
          class="pair-input"
          id="pairingToken"
          type="password"
          maxlength="64"
          placeholder="veya 64 haneli anahtarı yapıştırın"
        />
        <button class="btn-secondary" id="pairBtn">Bağlan</button>
      </div>
      <div class="pair-status" id="pairStatus" role="status"></div>
    </div>

    <div class="toolbar">
      <div class="tabs">
        <button class="tab active" id="tabCurrent">Bu Sayfa (<span id="cntPage">0</span>)</button>
        <button class="tab" id="tabAll">Tümü (<span id="cntAll">0</span>)</button>
      </div>
      <input class="search-input" id="searchInput" type="text" placeholder="Medya ara..." />
    </div>

    <div class="list" id="list"></div>

    <div class="settings-drawer" id="settingsDrawer">
      <label class="toggle-row">
        <span>Tarayıcı dosya indirmelerini VoltGet devralsın</span>
        <input type="checkbox" id="optIntercept" />
      </label>
      <label class="toggle-row">
        <span>Videoların üstünde yüzen indirme çubuğu göster</span>
        <input type="checkbox" id="optOverlay" />
      </label>
      <label class="toggle-row">
        <span>Sayfa değişince önceki sayfanın listesini temizle</span>
        <input type="checkbox" id="optAutoClear" />
      </label>
      <div class="pair-row" style="margin-top: 2px">
        <button class="btn-secondary" id="showPairBtn" style="flex: 1">
          Eşleştirme Panelini Göster
        </button>
      </div>
    </div>

    <footer class="footer">
      <div class="footer-left">
        <button class="btn-secondary" id="clearPage">Sayfayı Temizle</button>
        <button class="btn-danger" id="clearAll">Temizle</button>
      </div>
      <button class="btn" id="openApp">Uygulamayı Aç</button>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
