name: Release VoltGet

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Types and Lint
        run: |
          npx tsc --noEmit -p tsconfig.json
          npm run lint

      - name: Run Unit and Integration Tests
        run: npm test

      - name: Download Latest yt-dlp Binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "bin", "dist/bin"
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "bin/yt-dlp.exe"
          Copy-Item -Path "bin/yt-dlp.exe" -Destination "dist/bin/yt-dlp.exe"
          $size = (Get-Item "bin/yt-dlp.exe").Length
          Write-Host "Downloaded yt-dlp.exe size: $size bytes"

      - name: Build Electron Main & Preload
        run: npm run build:electron

      - name: Build Renderer
        run: npm run build:renderer

      - name: Test Electron Application
        run: npx playwright test

      - name: Package Windows Installers (NSIS & Portable)
        run: npx electron-builder --win --x64 --publish never

      - name: Generate Checksums
        shell: pwsh
        run: |
          Get-ChildItem -Path "release/*.exe" | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash
            "$hash  $($_.Name)" | Out-File -FilePath "release/checksums.sha256.txt" -Append -Encoding utf8
          }
          Get-Content "release/checksums.sha256.txt"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/checksums.sha256.txt
          generate_release_notes: true
          body: |
            ## VoltGet 1.1.6
            ### IDM Benzeri 3-Kolon Layout
            - **Sağ Sidebar Kuyruk**: İndirme kuyruğu artık kalıcı sağ panelde (280px) - progress bar, hız/ETA, hızlı aksiyonlar
            - **DownloadPanel Temizlendi**: Sadece URL girişi/analiz; inline job kartları kaldırıldı
            - **3-Kolon Düzen**: Sol nav (224px) + Ana içerik + Sağ sidebar - IDM benzeri tek ekran deneyimi
            - **Duplicate Kaldırıldı**: Alt kısımdaki ikinci QueuePanel silindi
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
